<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h2>Test History</h2>
  <nav><a href="/">Home</a><a href="/logout">Logout</a></nav>
</header>
<main>
<section class="card">
  {% if items %}
    {% for item in items %}
      <div class="history">
        <b>{{item.score}} / {{item.total}}</b>
        <span>{{item.date}}</span>
      </div>
    {% endfor %}
  {% else %}
    <p>No test history yet.</p>
  {% endif %}
</section>
</main>
</body>
</html>
