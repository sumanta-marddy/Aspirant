<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free MCQ Generator</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div>
    <h2>Aspirant MCQ Mock App</h2>
    <small>{{user}}</small>
  </div>
  <nav>
    <a href="/history">History</a>
    <a href="/logout">Logout</a>
  </nav>
</header>

<main>
<section class="card">
  <h3>Upload PDF / Paste Notes</h3>
  <p class="muted">Free rule-based MCQ generator. Paid AI API ki zarurat nahi.</p>
  <form id="genForm">
    <label>PDF/TXT File</label>
    <input type="file" name="file" accept=".pdf,.txt">
    <label>Ya notes paste karo</label>
    <textarea name="notes" rows="8" placeholder="Yaha notes paste karo..."></textarea>
    <label>Number of questions</label>
    <select name="count">
      <option>5</option><option selected>10</option><option>15</option><option>20</option>
    </select>
    <button type="submit">Generate Mock Test</button>
  </form>
</section>

<section id="testBox" class="card hidden">
  <div class="topline">
    <h3>Mock Test</h3>
    <b id="timer">00:00</b>
  </div>
  <div id="questions"></div>
  <button onclick="submitTest()">Submit Test</button>
</section>

<section id="resultBox" class="card hidden">
  <h3>Result</h3>
  <div id="score"></div>
  <div id="review"></div>
</section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
